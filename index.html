<title>SSI Tracker HTPN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px)}
img{max-width:100%}
[hidden]{display:none!important}
a.back{text-decoration:none}
#busy{position:fixed;top:0;left:0;right:0;height:3px;z-index:40;background:linear-gradient(90deg,var(--lime),var(--accent),var(--lime));background-size:200% 100%;animation:bz 1s linear infinite}
@keyframes bz{to{background-position:-200% 0}}
.lbtn:disabled{opacity:.7}
/* Layout: app shell — top bar, working column (max 1100px), bottom nav untuk telefon. Tema cerah ikut logo SSI Tracker (hijau + lime) */
:root{
  --bg:#f4faf0; --surface:#ffffff; --sunk:#eaf4e3; --ink:#123018; --muted:#55705a; --line:#d4e6cb;
  --accent:#1f8a35; --accent-ink:#ffffff; --accent-soft:#e1f3d8; --lime:#8cc63f; --deep:#0f5a20;
  --good:#2a7d3a; --good-soft:#e1f2dc; --warn:#9a6312; --warn-soft:#fcf0d8; --bad:#b0281c; --bad-soft:#fbe4e1;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r:12px;
  --s-pre:#dce9f7; --s-intra:#fbefcb; --s-post:#f8e0d6; --s-type:#e0efd6;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:16px 110px}
h1,h2,h3{text-wrap:balance;margin:0;letter-spacing:-.01em;font-weight:800}
h2{font-size:1.3rem} h3{font-size:1.02rem;font-weight:700}
.mono{font-family:var(--f-mono);font-size:.86em}
.muted{color:var(--muted)}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.preview{background:var(--warn-soft);color:var(--warn);font-size:.78rem;font-weight:700;padding:5px 16px;text-align:center}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:3px solid var(--lime);box-shadow:0 2px 10px rgba(15,90,32,.08)}
.top .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand .lg-s{width:42px;height:42px;border-radius:50%;flex:none;object-fit:cover;background:#fff}
.brand h1{font-size:1.1rem;line-height:1.1;color:var(--deep)}
.brand small{display:block;font-size:.72rem;color:var(--muted);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:700}
.btn.pri{background:linear-gradient(90deg,var(--accent),#3ea33b);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:.85rem}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:4px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding-bottom:env(safe-area-inset-bottom,0px)}
.pend{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
.pend:first-child{border-top:0}
.pinfo{border:0;background:none;text-align:left;display:flex;flex-direction:column;gap:2px;padding:0;min-width:0;flex:1 1 200px}
.pbtn{display:flex;gap:8px}
.btn.good{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.remind{border-color:var(--warn);background:var(--warn-soft)}
.remind h3{color:var(--warn)}
.remh{width:100%;display:flex;align-items:center;gap:14px;border:0;background:none;padding:0;text-align:left;color:var(--ink)}
.remh b{color:var(--warn)}
.remh .chev{width:20px;height:20px;margin-left:auto;color:var(--warn);transition:transform .2s;flex:none}
.remind.open .remh .chev{transform:rotate(180deg)}
.remn{min-width:46px;height:46px;border-radius:12px;background:var(--warn);color:#fff;font-size:1.35rem;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 8px;font-variant-numeric:tabular-nums}
.remlist{margin-top:12px;max-height:380px;overflow-y:auto;border-top:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.remind .pend{border-top-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.bnav button{position:relative}
.badge{position:absolute;top:3px;left:50%;margin-left:5px;background:var(--bad);color:#fff;font-size:.66rem;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.lrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 0;border-top:1px solid var(--line);align-items:center}
.lrow:first-of-type{border-top:0}
.lrow h3{grid-column:1/-1}
.lrow .st{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lrow .st .ok{color:var(--good);font-weight:800}
.bnav button{border:0;background:none;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.74rem;font-weight:700;color:var(--muted)}
.bnav button svg{width:22px;height:22px}
.bnav button.on{color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f > span,.flabel{font-size:.76rem;font-weight:700;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.fwide{grid-column:1/-1}
.req::after{content:" *";color:var(--bad)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 11px;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
select.inline{width:auto}
.calc{background:var(--sunk);border:1px dashed var(--line);border-radius:9px;padding:10px 11px;font-family:var(--f-mono);font-size:.9rem;min-height:42px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 13px;font-size:.88rem}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.sec{border-top:1px solid var(--line);padding-top:18px;display:flex;flex-direction:column;gap:14px}
.sec:first-child{border-top:0;padding-top:0}
.accs{display:flex;flex-direction:column;gap:10px}
.acc{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.acch{width:100%;display:flex;align-items:center;gap:10px;padding:15px 16px;border:0;text-align:left;font-weight:800;letter-spacing:.04em;font-size:.95rem}
.acch.red{background:var(--bad-soft);color:var(--bad)}
.acch.green{background:var(--good-soft);color:var(--good)}
.acch .dot{width:10px;height:10px;border-radius:50%;background:currentColor;flex:none}
.acch .cnt{margin-left:auto;font-size:.8rem;font-weight:700;letter-spacing:0;white-space:nowrap}
.acch .chev{width:18px;height:18px;flex:none;transition:transform .2s}
.acc.open .chev{transform:rotate(180deg)}
.accb{padding:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
input.miss{border-color:var(--bad)}
.miss-l{color:var(--bad)!important}
.pfwrap{display:flex;flex-direction:column;gap:12px}
.pftitle{text-align:center;font-weight:800;font-size:1.08rem}
.pf{border:1.5px solid var(--ink);font-size:.86rem}
.pf h4{margin:0;padding:6px 10px;font-size:.8rem;font-weight:800;letter-spacing:.04em;border-bottom:1px solid var(--ink)}
.pf.pre h4{background:var(--s-pre)} .pf.intra h4{background:var(--s-intra)} .pf.post h4{background:var(--s-post)} .pf.type h4{background:var(--s-type)}
.pf .r{display:grid;grid-template-columns:minmax(110px,36%) 1fr;border-bottom:1px solid var(--line)}
.pf .r:last-child{border-bottom:0}
.pf .r>span{padding:6px 10px;border-right:1px solid var(--line)}
.pf .r>div{padding:6px 10px;display:flex;flex-wrap:wrap;gap:4px 14px;min-width:0;overflow-wrap:anywhere}
.pf .r.empty>div{background:var(--bad-soft)}
.bx{white-space:nowrap;color:var(--muted)}
.bx.on{font-weight:800;color:var(--ink)}
.xl-title{text-align:center;font-weight:800;font-size:.95rem;letter-spacing:.02em}
.xl-meta{display:flex;gap:24px;flex-wrap:wrap;font-size:.86rem;font-weight:700}
.jkn th.grp{background:var(--accent);color:var(--accent-ink);text-align:center;font-size:.68rem}
.jkn th.grp2{background:var(--accent-soft);color:var(--accent);text-align:center;font-size:.66rem}
.jkn th.blank{background:var(--surface);border-bottom-color:transparent}
.sectag{display:inline-block;background:var(--deep);color:var(--accent-ink);font-size:.72rem;font-weight:800;letter-spacing:.08em;padding:4px 10px;border-radius:6px}
.hint{font-size:.8rem;color:var(--muted)}
.flag{font-size:.8rem;font-weight:700;padding:3px 8px;border-radius:6px;display:inline-block}
.pill{font-size:.74rem;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap;display:inline-block}
.g{background:var(--good-soft);color:var(--good)} .w{background:var(--warn-soft);color:var(--warn)} .b{background:var(--bad-soft);color:var(--bad)} .n{background:var(--sunk);color:var(--muted)} .a{background:var(--accent-soft);color:var(--accent)}
.formbar{position:sticky;bottom:calc(62px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);padding:12px 16px;margin:18px -16px -16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-radius:0 0 var(--r) var(--r)}
.meter{flex:1;min-width:120px;height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.meter i.done{background:var(--good)}
.case{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:13px 0;border-top:1px solid var(--line);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.case:first-child{border-top:0}
.case .t{font-weight:700}
.case .tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:start}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi b{display:block;font-size:1.85rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:.8rem;color:var(--muted)}
.kpi.alert b{color:var(--bad)} .kpi.warn b{color:var(--warn)}
.bar{display:grid;grid-template-columns:minmax(110px,1.2fr) 2fr 56px;gap:10px;align-items:center;font-size:.88rem}
.bar .trk{height:12px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bar .trk i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar .trk i.lo{background:var(--warn)}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.trend{display:grid;gap:10px;align-items:end;height:170px;padding-top:20px}
.tcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%;min-width:0}
.tbar{width:100%;max-width:48px;background:var(--accent);border-radius:6px 6px 2px 2px;position:relative;min-height:3px}
.tbar span{position:absolute;top:-19px;left:0;right:0;text-align:center;font-size:.78rem;font-weight:800;font-variant-numeric:tabular-nums}
.tlab{font-size:.74rem;color:var(--muted);font-weight:600}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:9px}
table{border-collapse:collapse;width:100%;font-size:.84rem;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:8px 9px;text-align:left;vertical-align:top}
th{background:var(--sunk);font-size:.7rem;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
td.num,th.num{text-align:right}
tr.ssi td{background:var(--bad-soft)}
tr.grp td{background:var(--accent-soft);font-weight:800;color:var(--accent)}
.jkn th,.jkn td{white-space:nowrap}
.sign{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;font-size:.88rem}
.sign div{border:1px solid var(--line);border-radius:9px;padding:12px;display:flex;flex-direction:column;gap:3px}
.calcbox{display:flex;gap:24px;flex-wrap:wrap;background:var(--accent-soft);border-radius:9px;padding:12px 16px}
.calcbox div{display:flex;flex-direction:column}
.calcbox b{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}
.calcbox span{font-size:.78rem;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px 16px}
.kv div{display:flex;flex-direction:column;min-width:0}
.kv span{font-size:.72rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.kv b{font-weight:600;overflow-wrap:anywhere}
.phead{display:flex;flex-direction:column;gap:10px}
.phead h2{font-size:1.4rem}
.log{display:flex;flex-direction:column;gap:8px}
.log div{border-left:3px solid var(--accent);padding:4px 0 4px 12px}
.search{position:relative}
.search input{padding-left:40px;font-size:1rem;background:var(--surface)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.mods{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.mod{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.thumb{aspect-ratio:16/9;max-width:100%;position:relative;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,#0f5a20,#5fb43a)}
.thumb.drive{background:linear-gradient(135deg,#2c6e1f,#a3cf4b)}
.thumb.link{background:linear-gradient(135deg,#1d6b5a,#4fb39a)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .ico{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center}
.thumb .ico svg{width:26px;height:26px}
.thumb .src{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;font-size:.7rem;font-weight:700;padding:2px 7px;border-radius:5px;z-index:1}
.thumb .done{position:absolute;right:8px;top:8px;z-index:1;background:#2b7a47;color:#fff;font-size:.7rem;font-weight:800;padding:3px 8px;border-radius:5px}
.mod .bd{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.mod .bd p{margin:0;font-size:.86rem;color:var(--muted)}
.mod .act{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
a.btn{text-decoration:none;color:var(--ink);display:inline-block}
a.btn.pri{color:var(--accent-ink)}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:9px;font-weight:700;z-index:20;max-width:calc(100% - 32px);text-align:center}
.empty{padding:24px;text-align:center;color:var(--muted)}
/* Login — single look (langit biru), warna tetap */
.lg{min-height:100dvh;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding-inline:16px;padding-block:20px 40px;
  background:linear-gradient(180deg,#0f5a20 0%,#1f8a35 34%,#8cc63f 72%,#f0f9e8 100%)}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.6;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}
.lang{align-self:flex-end;display:flex;background:#fff;border:3px solid #d4ecc6;border-radius:999px;padding:3px;position:relative;z-index:1}
.lang button{border:0;background:transparent;color:#1f7a30;font-weight:700;font-size:1rem;padding:8px 18px;border-radius:999px}
.lang button.on{background:#1f8a35;color:#fff}
.lcard{position:relative;z-index:1;margin-block:auto;width:100%;max-width:420px;background:#fff;color:#0f3d1c;border:2px solid #d4ecc6;border-radius:28px;
  padding:26px 24px 28px;box-shadow:0 24px 60px rgba(15,90,32,.28);display:flex;flex-direction:column;gap:14px}
.back{align-self:flex-start;border:0;background:none;color:#1f8a35;font-weight:800;font-size:1.05rem;padding:4px 0}
.logo{align-self:center;width:170px;height:170px;border-radius:50%;background:#fff;box-shadow:0 8px 28px rgba(31,138,53,.30);overflow:hidden}
.logo img{display:block;width:100%;height:100%;object-fit:cover}
.lcard h2{text-align:center;font-size:1.75rem;color:#0f3d1c}
.eyebrow{text-align:center;font-size:.72rem;font-weight:800;letter-spacing:.12em;color:#1f8a35;margin-bottom:-10px}
.lsub{text-align:center;color:#557060;margin:-6px 0 4px;font-size:1rem;line-height:1.55}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#eef7e8;border-radius:18px;padding:6px}
.seg button{border:0;background:transparent;border-radius:14px;padding:12px 6px;font-weight:800;font-size:.95rem;color:#2f5a37}
.seg button.on{background:#fff;color:#1f8a35;box-shadow:0 3px 10px rgba(15,90,32,.12)}
.lf{display:flex;flex-direction:column;gap:7px}
.lf > span{font-weight:800;color:#0f3d1c;font-size:1rem}
.lf input,.lf select{background:#fff;color:#0f3d1c;border:2px solid #d4e6cb;border-radius:14px;padding:13px 14px;font-size:1rem}
.lf input:focus,.lf select:focus{border-color:#1f8a35}
.pw{position:relative}
.pw input{padding-right:52px;font-size:1.1rem;letter-spacing:.04em}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:#1f7a30;padding:6px;display:flex}
.lhint{margin:-6px 0 0;color:#5f7563;font-size:.9rem}
.lerr{margin:0;background:#fde8e6;color:#b0281c;border-radius:10px;padding:9px 12px;font-weight:700;font-size:.9rem}
.lbtn{border:0;border-radius:16px;padding:16px;font-weight:800;font-size:1.15rem;color:#fff;background:linear-gradient(90deg,#1f8a35,#7cbf2e);box-shadow:0 10px 24px rgba(31,138,53,.35)}
@media (max-width:560px){ .case{grid-template-columns:1fr} .case .tags{justify-content:flex-start} .bar{grid-template-columns:1fr 1.3fr 48px} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function store(v){try{if(v===undefined)return localStorage.getItem('ssiTracker_token');if(v)localStorage.setItem('ssiTracker_token',v);else localStorage.removeItem('ssiTracker_token')}catch(e){return null}}
let BUSY=0;function busy(d){BUSY+=d;const b=$('#busy');if(b)b.hidden=BUSY<=0}
async function api(action,data){
  if(!API_URL||API_URL.indexOf('PASTE_')===0)throw new Error('App not connected yet: set API_URL in index.html');
  busy(1);
  try{
    const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,token:S.token},data||{}))});
    const j=await res.json();
    if(!j.ok){if(j.error==='AUTH'&&action!=='login'){S.user=null;S.token=null;store(null);render();toast('Session expired. Please log in again.')}throw new Error(j.error||'Server error')}
    return j;
  }catch(e){if(e instanceof TypeError)throw new Error('No connection to server. Check your internet.');throw e}
  finally{busy(-1)}
}
function persist(c){if(!c)return;api('saveCase',{c}).catch(e=>toast('Not saved: '+e.message))}

async function sendReport(m){

}

function fieldHTML(f,c,scope){
  if(f.show&&!f.show(c))return'';
  const rq=val(f.req,c)?'req':'';
  if(f.t==='calc'){
    let v='—',flag='';
    if(f.k==='_durasi'){const d=durasi(c);if(d!=null)v=hhmm(d)}
    if(f.k==='_abxtiming'){const g=abxGap(c);if(g!=null){v=g+' min';flag=g>=0&&g<=60?'<span class="flag g">Within 60 min</span>':'<span class="flag b">Over 60 min</span>'}}
    if(f.k==='_surv'){v=survDays(c)+' days';flag=`<span class="hint">${c.implan==='Ya'?'(implant)':''}</span>`}
    if(f.k==='_hariSSI'){if(c.tarikhSSI&&c.tarikhOp)v='Day '+dayDiff(c.tarikhOp,c.tarikhSSI)}
    return `<label class="f"><span>${f.l}</span><div class="calc" data-calc="${f.k}">${v} ${flag}</div></label>`;
  }
  const miss=(scope==='draft'||scope==='sd')&&rq&&(c[f.k]===undefined||c[f.k]==='');
  if(f.t==='multi'){
    const sel=(c[f.k]||'').split(', ').filter(Boolean);
    return `<div class="f fwide"><span class="flabel ${rq} ${miss?'miss-l':''}">${f.l}</span><div class="chips">${f.o.map(x=>`<button type="button" class="chip ${sel.includes(x)?'on':''}" data-s="${scope}" data-k="${f.k}" data-v="${esc(x)}" data-multi="1">${esc(L_(x))}</button>`).join('')}</div></div>`;
  }
  if(f.t==='chip'){
    const o=val(f.o,c);
    return `<div class="f fwide"><span class="flabel ${rq} ${miss?'miss-l':''}">${f.l}</span><div class="chips">${o.length?o.map(x=>`<button type="button" class="chip ${c[f.k]===x?'on':''}" data-s="${scope}" data-k="${f.k}" data-v="${esc(x)}">${esc(L_(x))}</button>`).join(''):'<span class="hint">No options</span>'}</div></div>`;
  }
  const type={text:'text',num:'number',date:'date',time:'time'}[f.t];
  return `<label class="f"><span class="${rq}">${f.l}</span><input type="${type}" class="${miss?'miss':''}" id="${scope}_${f.k}" data-s="${scope}" data-in="${f.k}" value="${esc(c[f.k])}" ${f.ph?`placeholder="${f.ph}"`:''} ${f.step?`step="${f.step}"`:''} ${f.t==='num'?'inputmode="decimal"':''}></label>`;
}

function hdrKey(h,seen){
  const t=String(h||'').replace(/\s+/g,' ').trim().toUpperCase();if(!t)return null;
  const once=k=>{if(seen[k]){return null}seen[k]=1;return k};
  if(/^NUM|^NO\.?$/.test(t))return once('_num');
  if(/^NAME$|^NAME OF PATIENT/.test(t))return once('nama');
  if(/NAME OF PROCEDURE/.test(t))return once('prosedur');
  if(/^RACE/.test(t))return once('bangsa');
  if(/^GENDER/.test(t))return once('jantina');
  if(/^AGE|D\.O\.B/.test(t))return once('umur');
  if(/MRN/.test(t))return once('mrn');
  if(/IDENTIFICATION|PASSPORT|^IC\b/.test(t))return once('ic');
  if(/CONTACT/.test(t))return once('telefon');
  if(/DATE.*SURGERY/.test(t))return once('tarikhOp');
  if(/START/.test(t))return once('masaMula');
  if(/END TIME|SURGERY END/.test(t))return once('masaTamat');
  if(/DURATION OF SURGERY/.test(t))return once('_dur');
  if(/DURATION OF SURVEILLANCE/.test(t))return once('_survdur');
  if(/DURATION.*ANTIBIOTIC/.test(t))return once('abxPost');
  if(/SURGERY PERFORMED/.test(t))return once('kategori');
  if(/IMPLANT/.test(t))return once('implan');
  if(/TYPE OF SURGERY/.test(t))return once('jenisLuka');
  if(/PRIMARY SURGEON/.test(t))return once('pakar');
  if(/ADMISSION|READMISSION/.test(t))return /READMISSION/.test(t)?once('tarikhReadmit'):once('tarikhMasuk');
  if(/BMI|BODY MASS/.test(t))return once('bmi');
  if(/ANTIBIOTIC PROPHYLAXIS/.test(t))return seen.abxPre?once('abx'):once('abxPre');
  if(/^DM$|DIABETES/.test(t))return once('dm');
  if(/BATHING/.test(t))return once('mandi');
  if(/HAIR/.test(t))return once('rambut');
  if(/SMOK|VAP/.test(t))return once('rokok');
  if(/IMMUNO/.test(t))return once('imuno');
  if(/1ST|1st/i.test(t)&&/SKIN|LAYER/.test(t))return once('kulit1');
  if(/2ND/.test(t)&&/SKIN|LAYER/.test(t))return once('kulit2');
  if(/TIME OF ADMIN|IF YES|TIME GIVEN/.test(t))return once('masaAbx');
  if(/REDOSING REASON/.test(t))return once('sebabRedose');
  if(/^REDOSING/.test(t))return once('redose');
  if(/IF OTHERS/.test(t))return once('sebabLain');
  if(/SUTURE/.test(t))return once('jahitan');
  if(/DRAIN/.test(t))return once('drain');
  if(/SUGAR/.test(t))return once('gula');
  if(/DAY OF SSI|DATE OF SSI|IDENTIFIED/.test(t))return once('_hari');
  if(/SITE OF SSI/.test(t))return once('tapak');
  if(/ORGANISM/.test(t))return once('organisma');
  if(/READMIT/.test(t))return once('readmit');
  if(/^DIAGNOSIS/.test(t))return seen.diagnosis?once('_diag2'):once('diagnosis');
  return null;
}
const isoOf=(y,m,d)=>{const dt=new Date(y,m-1,d);return dt.getFullYear()===y&&dt.getMonth()===m-1&&y>2000&&y<2100?`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`:''};
function toISO(v){
  if(Object.prototype.toString.call(v)==='[object Date]'&&!isNaN(v))return isoOf(v.getFullYear(),v.getMonth()+1,v.getDate());
  if(typeof v==='number'&&v>20000&&v<80000&&window.XLSX){const p=XLSX.SSF.parse_date_code(v);return p?isoOf(p.y,p.m,p.d):''}
  const s=String(v||'').trim();let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return isoOf(+m[1],+m[2],+m[3]);
  m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);if(m){let y=+m[3];if(y<100)y+=2000;return isoOf(y,+m[2],+m[1])}
  return '';
}
function toTime(v){
  let h,mi;
  if(Object.prototype.toString.call(v)==='[object Date]'&&!isNaN(v)){h=v.getHours();mi=v.getMinutes()}
  else if(typeof v==='number'){if(v>20000)v=v%1;if(v>0&&v<1){const t=Math.round(v*1440);h=Math.floor(t/60);mi=t%60}else if(v>=1&&v<2400){h=Math.floor(v/100);mi=Math.round(v%100);if(v<24){h=Math.floor(v);mi=Math.round((v-h)*100)}}}
  else{const s=String(v||'').toUpperCase().replace(/H(RS?)?$/,'').trim();let m=s.match(/^(\d{1,2})[:.](\d{2})/);
    if(m){h=+m[1];mi=+m[2]}else if((m=s.match(/^(\d{3,4})$/))){const n=m[1].padStart(4,'0');h=+n.slice(0,2);mi=+n.slice(2)}}
  if(h==null||isNaN(h)||h>23||mi>59||(h===0&&mi===0))return '';
  return String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0');
}

function normProc(j,cat,proc){

      c.bangsa=NORM.bangsa(g('bangsa'));c.jantina=NORM.jantina(g('jantina'))||(jab==='O&G'?'Perempuan':'');
      const age=String(g('umur')).trim();if(/^\d{1,3}$/.test(age))c.umur=age;else if(age)W(`age "${age}" not valid, left blank`);

      if(map.ic!=null)c.ic=String(g('ic')).trim();

      c.kategori=normProc(jab,g('kategori'),g('prosedur'));c.prosedur=String(g('prosedur')||'').trim()||c.kategori;
      if(o.skipOther&&!(PROC[jab]||[]).includes(c.kategori)){skipOther++;continue}
      c.implan=ynv(g('implan'));c.jenisLuka=NORM.jenisLuka(g('jenisLuka'));c.pakar=NORM.pakar(g('pakar'));
      c.diagnosis=String(g('diagnosis')||'').trim();c.tarikhMasuk=toISO(g('tarikhMasuk'));
      const bmi=parseFloat(String(g('bmi')).replace(',','.'));if(!isNaN(bmi)){if(bmi>=10&&bmi<=90)c.bmi=String(bmi);else W(`BMI ${bmi} out of range, left blank`)}
      c.abxPre=ynv(g('abxPre'));c.dm=NORM.dm(g('dm'));c.mandi=ynv(g('mandi'));c.rambut=NORM.rambut(g('rambut'));c.rokok=NORM.rokok(g('rokok'));c.imuno=NORM.imuno(g('imuno'));
      c.kulit1=NORM.kulit(g('kulit1'));if(c.kulit1==='None')c.kulit1='';c.kulit2=NORM.kulit(g('kulit2'));
      c.abx=ynv(g('abx'));c.masaAbx=toTime(g('masaAbx'));if(c.masaAbx&&!c.abx)c.abx='Ya';
      c.redose=NORM.redose(g('redose'));if(c.abx==='Ya'&&!c.redose&&map.redose!=null&&U(g('redose'))==='')c.redose='';
      c.sebabRedose=c.redose&&c.redose!=='None'?NORM.sebabRedose(g('sebabRedose')):'';c.sebabLain=c.sebabRedose==='Others'?String(g('sebabLain')||g('sebabRedose')).trim():'';
      c.jahitan=ynv(g('jahitan'));c.drain=ynv(g('drain'));c.gula=ynv(g('gula'));c.abxPost=NORM.abxPost(g('abxPost'));
      const hari=g('_hari'),site=NORM.tapak(g('tapak')),d2=U(g('_diag2')),org=String(g('organisma')||'').trim();
      const hd=toISO(hari),hn=String(hari).match(/(\d{1,3})/),hasDay=hd||(hn&&!/H$|HOUR|NIL/i.test(String(hari)));
      if(site||/CLINICAL|LAB/.test(d2)||(hasDay&&(site||d2))){
        c.ssi='Ya';c.tapak=site;c.diagJenis=/LAB/.test(d2)||(org&&!/NIL|^NO/i.test(org))?'Lab confirmed':/CLIN/.test(d2)?'Clinical':'';
        c.organisma=c.diagJenis==='Lab confirmed'?org:'';c.readmit=ynv(g('readmit'));
        if(hd)c.tarikhSSI=hd;else if(hn){const t=new Date(c.tarikhOp+'T00:00:00');t.setDate(t.getDate()+(+hn[1]));c.tarikhSSI=isoOf(t.getFullYear(),t.getMonth()+1,t.getDate())}
        if(!c.tarikhSSI)W('SSI found but day of SSI missing');
      }
      if(c.ssi!=='Ya'&&o.autoClose&&daysPost(c)>=survDays(c))c.tutup=true;
      Object.keys(c).forEach(k=>{if(c[k]==='')delete c[k]});

function impReparse(){const I=S.imp;if(!I||!I.wb)return;try{I.res=parseWorkbook(I.wb,I.jab,I);I.err=''}catch(e){I.res=null;I.err='Could not read this file: '+e.message}}
function impRead(file){
  const I=S.imp;if(!file||!I)return;
  if(!window.XLSX){toast('Excel reader not loaded. Check your internet connection.');return}
  if(/\.pdf$/i.test(file.name)){I.err='PDF files cannot be read reliably. Please upload the original Excel (.xlsx) file.';I.res=null;keepY();return}
  I.busy=true;I.fname=file.name;keepY();
  const fr=new FileReader();
  fr.onload=()=>{try{I.wb=XLSX.read(new Uint8Array(fr.result),{type:'array',cellDates:false});impReparse()}catch(e){I.err='Could not read this file: '+e.message}I.busy=false;keepY()};
  fr.onerror=()=>{I.busy=false;I.err='Could not read this file';keepY()};
  fr.readAsArrayBuffer(file);
}

  if(id==='monthSel'){S.month=T.value;keepY()}
  if(id==='cjabSel'){S.cjab=T.value;keepY()}
  if(id==='rmonthSel'){S.rmonth=T.value;S.mail=null;keepY()}
  if(id==='pmonthSel'){S.pmonth=T.value;keepY()}
  if(['masaAbx','masaMula','tarikhSSI','tarikhOp'].includes(T.dataset.in))keepY();
});
function liveCalc(){
  if(S.cur&&S.sd){updateHeads(ALLSEC,S.sd,'csec');const d=document.querySelector('[data-calc="_durasi"]');if(d){const v=durasi(S.sd);d.textContent=v!=null?hhmm(v):'—'}return}
  if(!S.draft||!$('#meter'))return;const c=S.draft,cp=complete(c);updateHeads(SECTIONS,c,'sech');
  const m=$('#meter');m.style.width=cp.pct+'%';m.classList.toggle('done',cp.pct===100);
  $('#meterTxt').textContent=cp.pct+'% complete'+(cp.missing?' · '+cp.missing+' required left':'');
  const d=document.querySelector('[data-calc="_durasi"]');if(d){const v=durasi(c);d.textContent=v!=null?hhmm(v):'—'}
}
function saveEntry(){
  const c=S.draft;
  if(!c.nama||!c.mrn||!c.tarikhOp){toast('Enter name, MRN and date of surgery first');return}
  const dup=S.cases.find(x=>x.id!==c.id&&x.mrn===c.mrn&&x.tarikhOp===c.tarikhOp);
  if(dup){toast('This MRN already has a surgery on the same date');return}
  if(c.id){S.cases[S.cases.findIndex(x=>x.id===c.id)]={...c}}else{c.id='c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);S.cases.push({...c})}persist(S.cases.find(x=>x.id===c.id));
  const cp=complete(c),id=c.id;S.draft=null;
  toast(cp.pct===100?'Saved':'Saved as draft · '+cp.missing+' required fields missing');
  if(S.user.role==='liaison'){S.tab='pesakit';S.pf='Semua';S.pmonth='Semua'}
  openCase(id);
}
function saveSSI(){
  const c=S.cases.find(x=>x.id===S.cur),d=S.sd;
  if(d.ssi==='Ya'){
    if(d.tarikhSSI){const day=dayDiff(d.tarikhOp,d.tarikhSSI);if(day<0||day>survDays(d)){toast(`SSI date must be within ${survDays(d)} days after surgery`);return}}
    const keep=c.susulan;Object.assign(c,JSON.parse(JSON.stringify(d)),{susulan:keep,tutup:false});
    const miss=reqAll(c).filter(k=>c[k]===undefined||c[k]==='').length;
    persist(c);keepY();toast(miss?`SSI form saved · ${miss} fields missing`:'SSI form complete & saved');
  }else{Object.assign(c,{ssi:'Tiada',tarikhSSI:'',tapak:'',diagJenis:'',diagKlinikal:'',organisma:'',readmit:'',tarikhReadmit:''});S.sd=JSON.parse(JSON.stringify(c));persist(c);keepY();toast('Saved')}
}
(async function boot(){const t=store();if(t){S.token=t;render();try{applyData(await api('bootstrap'))}catch(e){S.token=null;store(null)}}render()})();
</script>
