<title>SSI Tracker HTPN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px)}
img{max-width:100%}
[hidden]{display:none!important}
a.back{text-decoration:none}
#busy{position:fixed;top:0;left:0;right:0;height:3px;z-index:40;background:linear-gradient(90deg,var(--lime),var(--accent),var(--lime));background-size:200% 100%;animation:bz 1s linear infinite}
@keyframes bz{to{background-position:-200% 0}}
.lbtn:disabled{opacity:.7}
/* Layout: app shell — top bar, working column (max 1100px), bottom nav untuk telefon. Tema cerah ikut logo SSI Tracker (hijau + lime) */
:root{
  --bg:#f4faf0; --surface:#ffffff; --sunk:#eaf4e3; --ink:#123018; --muted:#55705a; --line:#d4e6cb;
  --accent:#1f8a35; --accent-ink:#ffffff; --accent-soft:#e1f3d8; --lime:#8cc63f; --deep:#0f5a20;
  --good:#2a7d3a; --good-soft:#e1f2dc; --warn:#9a6312; --warn-soft:#fcf0d8; --bad:#b0281c; --bad-soft:#fbe4e1;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r:12px;
  --s-pre:#dce9f7; --s-intra:#fbefcb; --s-post:#f8e0d6; --s-type:#e0efd6;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:16px 110px}
h1,h2,h3{text-wrap:balance;margin:0;letter-spacing:-.01em;font-weight:800}
h2{font-size:1.3rem} h3{font-size:1.02rem;font-weight:700}
.mono{font-family:var(--f-mono);font-size:.86em}
.muted{color:var(--muted)}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.preview{background:var(--warn-soft);color:var(--warn);font-size:.78rem;font-weight:700;padding:5px 16px;text-align:center}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:3px solid var(--lime);box-shadow:0 2px 10px rgba(15,90,32,.08)}
.top .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 16px;flex-wrap:wrap}
@media(max-width:560px){.brand .lg-s{width:46px;height:46px}.brand h1{font-size:1.25rem}.brand small{font-size:.76rem}}
.ai .aitxt ul{margin:.3em 0 .8em;padding-left:1.2em;line-height:1.55}.ai .aitxt li{margin:.25em 0}.ai .up{color:var(--bad)}.ai .dn{color:var(--accent)}

.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand .lg-s{width:58px;height:58px;border-radius:50%;flex:none;object-fit:cover;background:#fff}
.brand h1{font-size:1.5rem;line-height:1.1;color:var(--deep)}
.brand small{display:block;font-size:.85rem;color:var(--muted);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:700}
.btn.pri{background:linear-gradient(90deg,var(--accent),#3ea33b);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:.85rem}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:4px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding-bottom:env(safe-area-inset-bottom,0px)}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--sunk);border-radius:14px;padding:5px}
.seg2 button{border:0;background:transparent;border-radius:10px;padding:11px 8px;font-weight:700;color:var(--muted)}
.seg2 button.on{background:var(--surface);color:var(--accent);box-shadow:0 2px 8px rgba(15,90,32,.12)}
a.btn.wa{background:#25d366;border-color:#25d366;color:#fff}
table.ot input,table.ot select{padding:6px 8px;font-size:.85rem;min-width:110px}
table.ot td{vertical-align:middle}
tr.dupr td{opacity:.6}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,30,15,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modalc{background:var(--surface);border-radius:16px;padding:20px;max-width:440px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;line-height:1.5}
table.ot input.miss{border-color:var(--bad);background:var(--bad-soft)}
.ptab tr.prow{cursor:pointer}
.ptab tr.prow:hover td,.ptab tr.prow.open td{background:var(--accent-soft)}
.ptab tr.prow.zero{cursor:default;color:var(--muted)}
.ptab .caret{display:inline-block;width:18px;color:var(--accent);font-weight:800}
.ptab tr.pdet td{background:var(--bg);padding:6px 8px 10px}
.plist{display:flex;flex-direction:column;gap:4px}

function store(v){try{if(v===undefined)return localStorage.getItem('ssiTracker_token');if(v)localStorage.setItem('ssiTracker_token',v);else localStorage.removeItem('ssiTracker_token')}catch(e){return null}}
let BUSY=0;function busy(d){BUSY+=d;const b=$('#busy');if(b)b.hidden=BUSY<=0}
async function api(action,data){
  if(!API_URL||API_URL.indexOf('PASTE_')===0)throw new Error('App not connected yet: set API_URL in index.html');
  busy(1);
  try{
    const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,token:S.token},data||{}))});
    const j=await res.json();
    if(!j.ok){if(j.error==='AUTH'&&action!=='login'){S.user=null;S.token=null;store(null);render();toast('Session expired. Please log in again.')}throw new Error(j.error||'Server error')}
    return j;
  }catch(e){if(e instanceof TypeError)throw new Error('No connection to server. Check your internet.');throw e}
  finally{busy(-1)}
}

async function exportReport(){
  if(!S.rmonths.length){toast('Select at least one month');return}
  if(typeof api!=='function'){toast('Download works on the live app (Vercel)');return}
  const btn=$('[data-act="xlsdl"]');if(btn){btn.disabled=true;btn.textContent='Generating Excel…'}
  try{const r=await api('exportReport',{months:S.rmonths});
    const bin=atob(r.data),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
    const url=URL.createObjectURL(new Blob([u8],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    const a=document.createElement('a');a.href=url;a.download=r.file;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);
    toast('Downloaded '+r.file)}
  catch(e){toast('Download failed: '+e.message)}
  finally{const b=$('[data-act="xlsdl"]');if(b){b.disabled=false;b.textContent='⬇ Download Excel report'}}
}

function fieldHTML(f,c,scope){
  if(f.show&&!f.show(c))return'';
  const rq=val(f.req,c)?'req':'';
  if(f.t==='calc'){
    let v='—',flag='';
    if(f.k==='_durasi'){const d=durasi(c);if(d!=null)v=hhmm(d)}
    if(f.k==='_abxtiming'){const g=abxGap(c);if(g!=null){v=g+' min';flag=g>=0&&g<=60?'<span class="flag g">Within 60 min</span>':'<span class="flag b">Over 60 min</span>'}}
    if(f.k==='_surv'){v=survDays(c)+' days';flag=`<span class="hint">${c.implan==='Ya'?'(implant)':''}</span>`}
    if(f.k==='_hariSSI'){if(c.tarikhSSI&&c.tarikhOp)v='Day '+dayDiff(c.tarikhOp,c.tarikhSSI)}
    return `<label class="f"><span>${f.l}</span><div class="calc" data-calc="${f.k}">${v} ${flag}</div></label>`;
  }
  const miss=(scope==='draft'||scope==='sd')&&rq&&(c[f.k]===undefined||c[f.k]==='');
  if(f.t==='multi'){
    const sel=(c[f.k]||'').split(', ').filter(Boolean);
    return `<div class="f fwide"><span class="flabel ${rq} ${miss?'miss-l':''}">${f.l}</span><div class="chips">${f.o.map(x=>`<button type="button" class="chip ${sel.includes(x)?'on':''}" data-s="${scope}" data-k="${f.k}" data-v="${esc(x)}" data-multi="1">${esc(L_(x))}</button>`).join('')}</div></div>`;
  }
  if(f.t==='chip'){
    const o=val(f.o,c);
    return `<div class="f fwide"><span class="flabel ${rq} ${miss?'miss-l':''}">${f.l}</span><div class="chips">${o.length?o.map(x=>`<button type="button" class="chip ${c[f.k]===x?'on':''}" data-s="${scope}" data-k="${f.k}" data-v="${esc(x)}">${esc(L_(x))}</button>`).join(''):'<span class="hint">No options</span>'}</div></div>`;
  }
  const type={text:'text',num:'number',date:'date',time:'time'}[f.t];
  return `<label class="f"><span class="${rq}">${f.l}</span><input type="${type}" class="${miss?'miss':''}" id="${scope}_${f.k}" data-s="${scope}" data-in="${f.k}" value="${esc(c[f.k])}" ${f.ph?`placeholder="${f.ph}"`:''} ${f.step?`step="${f.step}"`:''} ${f.t==='num'?'inputmode="decimal"':''}></label>`;
}

function trendYear(list){
  const cy=TODAYISO.slice(0,4),ys=[...new Set(list.map(c=>(c.tarikhOp||'').slice(0,4)).filter(Boolean).concat([cy]))].sort();
  const y=S.dy&&S.dy!=='Semua'&&ys.includes(S.dy)?S.dy:ys.includes(S.ty)?S.ty:(ys.includes(cy)?cy:ys[ys.length-1]);
  const keys=Array.from({length:12},(_,i)=>y+'-'+String(i+1).padStart(2,'0'));

}
function trendHTML(list,keys){
  const data=keys.map(k=>{const l=list.filter(c=>monthKey(c)===k);return{k,n:l.length,s:l.filter(c=>c.ssi==='Ya').length}});
  const max=Math.max(1,...data.map(d=>d.n));
  return `<div class="trend" style="grid-template-columns:repeat(${data.length},1fr)">${data.map(d=>`<div class="tcol"><div class="tbar" style="height:${d.n/max*100}%"><span>${d.n}</span></div>
   <span class="pill ${d.s?'b':'n'}">${d.s} SSI</span><span class="tlab">${shortMonth(d.k)}</span></div>`).join('')}</div>`;
}

async function commitImport(){
  const I=S.imp;if(!I||!I.res||!I.res.cases.length)return;const M=mergeImport(I.res.cases),list=M.rows;
  const btn=$('[data-act="impgo"]');if(btn){btn.disabled=true;btn.textContent='Importing…'}
  try{let r=null;if(typeof api==='function'){
      // send in batches so large files are not cut off
      let added=0,updated=0;for(let i=0;i<list.length;i+=150){if(btn)btn.textContent=`Saving ${Math.min(i+150,list.length)} / ${list.length}…`;const x=await api('importCases',{cases:list.slice(i,i+150)});added+=x.added||0;updated+=x.updated||0}
      r={added,updated};const before=S.dy;await reloadData(true);
      const ids=new Set(S.cases.map(c=>c.id)),missing=list.filter(c=>!ids.has(c.id)).length;
      S.lastImp={jab:I.jab,n:list.length,added,updated,at:fmtD(TODAYISO)+' '+new Date().toTimeString().slice(0,5)};S.lj=I.jab;
      S.imp=null;S.dy='Semua';S.dm='Semua';S.cq='';keepY();
      toast(missing?`Warning: ${missing} of ${list.length} cases were not saved. Try importing again.`:`Saved to Google Sheet: ${list.length} cases (${added} new, ${updated} updated)`);return}
    const pos={};S.cases.forEach((c,i)=>pos[c.id]=i);list.forEach(c=>{if(pos[c.id]!=null)S.cases[pos[c.id]]=c;else S.cases.push(c)});
    S.lastImp={jab:I.jab,n:list.length,added:list.length-M.matched,updated:M.matched,at:fmtD(TODAYISO)};S.lj=I.jab;
    S.imp=null;S.dy='Semua';S.dm='Semua';S.cq='';keepY();toast(`Imported ${list.length} cases · ${list.length-M.matched} new, ${M.matched} already in app`)}
  catch(e){toast('Import failed: '+e.message);if(btn){btn.disabled=false;btn.textContent='Import '+list.length+' cases'}}
}

// ================= RISK FACTORS & DAY OF SSI (dashboard) =================
const RISK=[
 ['Obesity (BMI ≥ 30)',c=>c.bmi!==undefined&&c.bmi!=='',c=>parseFloat(c.bmi)>=30],
 ['Diabetes mellitus',c=>!!c.dm,c=>c.dm==='Ya'],
 ['Uncontrolled sugar (>11.1)',c=>!!c.gula,c=>c.gula==='Ya'],
 ['Active smoking / vaping',c=>!!c.rokok,c=>c.rokok==='Active'],
 ['Immunosuppressant therapy',c=>!!c.imuno,c=>c.imuno!=='None'],
 ['No pre-op bathing',c=>!!c.mandi,c=>c.mandi==='Tidak'],
 ['Hair removal by shaving',c=>!!c.rambut,c=>c.rambut==='Shaving'],
 ['Skin prep not chlorhexidine',c=>!!c.kulit1,c=>c.kulit1!=='Chlorhexidine'],
 ['Prophylaxis not given',c=>!!c.abx,c=>c.abx==='Tidak'],
 ['Prophylaxis > 60 min before incision',c=>c.abx==='Ya'&&abxGap(c)!=null,c=>abxGap(c)>60||abxGap(c)<0],
 ['Post-op antibiotic ≥ 24 h',c=>!!c.abxPost,c=>/24/.test(c.abxPost)&&!/Within/i.test(c.abxPost)],
 ['Contaminated wound',c=>!!c.jenisLuka,c=>c.jenisLuka==='Contaminated'],
 ['Surgery longer than 2 hours',c=>durasi(c)!=null,c=>durasi(c)>120],
 ['Implant used',c=>!!c.implan,c=>c.implan==='Ya'],
 ['Drain',c=>!!c.drain,c=>c.drain==='Ya']];
const DAYB=[['Day 0–7',0,7],['Day 8–14',8,14],['Day 15–21',15,21],['Day 22–30',22,30],['Day 31–90',31,90],['Not recorded',-1,-1]];
const ssiDay=c=>c.tarikhSSI&&c.tarikhOp?dayDiff(c.tarikhOp,c.tarikhSSI):null;
const inDayB=(c,b)=>{const d=ssiDay(c);return b[1]<0?d==null:d!=null&&d>=b[1]&&d<=b[2]};
const rfOk=c=>S.rf==null||S.rf==='Semua'||RISK[+S.rf][2](c)&&RISK[+S.rf][1](c);
function rfFilterBar(){return S.rf!=null&&S.rf!=='Semua'?`<div class="flag a row between" style="margin:0"><span>Showing only surgeries with <b>${esc(RISK[+S.rf][0])}</b></span><button class="btn sm" data-rf="Semua">✕ Clear risk filter</button></div>`:''}
function rfSelect(){return `<select class="inline" id="rfSel" aria-label="Risk factor"><option value="Semua">All risk factors</option>${RISK.map((r,i)=>`<option value="${i}" ${String(S.rf)===String(i)?'selected':''}>${esc(r[0])}</option>`).join('')}</select>`}
function riskPanel(base,DL){
  const rows=RISK.map((r,i)=>{const rec=base.filter(r[1]),w=rec.filter(r[2]),wo=rec.filter(c=>!r[2](c)),sw=w.filter(c=>c.ssi==='Ya').length,swo=wo.filter(c=>c.ssi==='Ya').length;
    return{i,name:r[0],n:w.length,N:rec.length,p:pct(w.length,rec.length),rw:pct(sw,w.length),rwo:pct(swo,wo.length),sw,hi:w.length&&sw&&pct(sw,w.length)>pct(swo,wo.length)}});

   <div class="scroll"><table class="rtab"><thead><tr><th>Risk factor</th><th>Surgeries with factor</th><th class="num">SSI rate with</th><th class="num">SSI rate without</th></tr></thead><tbody>
   ${rows.map(r=>`<tr class="rrow ${String(S.rf)===String(r.i)?'on':''}" data-rf="${String(S.rf)===String(r.i)?'Semua':r.i}" tabindex="0" role="button"><td>${esc(r.name)}</td>
    <td><div class="rbar"><div class="trk"><i style="width:${r.p}%"></i></div><span class="v">${r.p}%</span><span class="hint">${r.n}/${r.N}</span></div></td>
    <td class="num">${r.n?`<span class="${r.hi?'pill b':''}">${r.rw}%</span>`:'—'}</td><td class="num">${r.N-r.n?r.rwo+'%':'—'}</td></tr>`).join('')}

function dayPanel(ssiL,DL){

   <div class="dbars">${DAYB.map((b,i)=>{const n=ssiL.filter(c=>inDayB(c,b)).length;return `<button class="dbar ${String(S.dayb)===String(i)?'on':''}" data-dayb="${String(S.dayb)===String(i)?'x':i}" ${n?'':'disabled'}><span class="dl">${b[0]}</span><span class="trk"><i style="width:${n/max*100}%"></i></span><span class="v">${n}</span></button>`}).join('')}</div>
   ${sel?`<div class="plist">${pick.map(c=>`<button class="pitem" data-open="${c.id}"><span class="pd">Day ${ssiDay(c)??'?'}</span><span class="pn"><b>${esc(c.nama)}</b><span class="hint">${esc(c.jabatan)} · ${esc(c.kategori||'')} · ${fmtD(c.tarikhOp)} · ${esc(ssiSite(c)||'site not recorded')}</span></span><span class="pill b">SSI</span></button>`).join('')}</div>`:''}
   <div><span class="flabel">Type of SSI</span><div class="chips" style="margin-top:6px">${ty.map(t=>`<span class="pill ${t[0]==='Not classified'?(t[1]?'w':'n'):'b'}">${esc(t[0])}: ${t[1]}</span>`).join('')}</div></div>`

// ================= TREND (monthly for one year; yearly when "All years") =================
function trendPanel(src,DL){
  if(S.dy!=='Semua')return `<div class="panel"><h3>Monthly trend · ${esc(DL)}</h3>${trendYear(src)}</div>`;
  const l0=src.filter(c=>S.dm==='Semua'||(c.tarikhOp||'').slice(5,7)===S.dm);
  const ys=[...new Set(l0.map(c=>(c.tarikhOp||'').slice(0,4)).filter(Boolean))].sort();
  if(!ys.length)return `<div class="panel"><h3>Yearly trend · ${esc(DL)}</h3><div class="empty">No surgeries recorded.</div></div>`;
  const data=ys.map(y=>{const l=l0.filter(c=>(c.tarikhOp||'').startsWith(y));const s=l.filter(c=>c.ssi==='Ya').length;return{y,n:l.length,s,r:pct(s,l.length)}});
  const max=Math.max(1,...data.map(d=>d.n)),rmax=Math.max(1,...data.map(d=>d.r));
  return `<div class="panel stack"><h3>Yearly trend · ${esc(DL)}${S.dm!=='Semua'?' · '+BULAN[+S.dm-1]+' only':''}</h3>
   <p class="hint" style="margin:-6px 0 0">Surgeries monitored and SSI cases per year. Choose a year above to see its monthly trend.</p>
   <div class="trend" style="grid-template-columns:repeat(${data.length},minmax(0,90px));justify-content:center">${data.map(d=>`<div class="tcol"><div class="tbar" style="height:${d.n/max*100}%"><span>${d.n}</span></div>
    <span class="pill ${d.s?'b':'n'}">${d.s} SSI</span><span class="tlab">${d.y}</span></div>`).join('')}</div>
   <div><span class="flabel">SSI rate by year</span><div class="stack" style="gap:6px;margin-top:6px">${data.map(d=>`<div class="bar"><span>${d.y}</span><div class="trk"><i class="lo" style="width:${d.r/rmax*100}%"></i></div><span class="v">${d.r}%</span></div>`).join('')}</div></div></div>`;
}

// ================= SMART ANALYSIS (computed in the app from the filtered data) =================
function aiPanel(list,src,ctx){
  const head=`<div class="panel stack ai"><div class="row between"><h3>✨ Smart analysis · ${esc(ctx.DL)} · ${esc(ctx.ML)}</h3><div class="row">${S.ai?`<button class="btn sm" data-aicopy="1">Copy text</button><button class="btn sm" data-ai="0">Hide</button>`:`<button class="btn sm primary" data-ai="1">✨ Analyse this selection</button>`}</div></div>`;
  if(!S.ai)return head+`<p class="hint" style="margin:-4px 0 0">Reads the data you have filtered (year, month, department, risk factor) and writes key findings and suggested actions. Calculated inside the app; no patient data is sent anywhere.</p></div>`;
  const F=[],A=[],n=list.length,ssiL=list.filter(c=>c.ssi==='Ya'),s=ssiL.length,r=pct(s,n);
  const rate=l=>pct(l.filter(c=>c.ssi==='Ya').length,l.length);
  if(!n)return head+`<div class="empty">No monitored surgeries in this selection.</div></div>`;
  F.push(`<b>${n}</b> monitored surgeries with <b>${s}</b> SSI case${s===1?'':'s'}, an SSI rate of <b>${r}%</b>${ctx.rf?` (only surgeries with ${esc(ctx.rf)})`:''}.`);
  // Comparison with previous period
  if(S.dy!=='Semua'){const py=String(+S.dy-1),pl=src.filter(c=>pMatch(c,py,S.dm));
    if(pl.length){const pr=rate(pl),d=Math.round((r-pr)*10)/10;F.push(`Compared with the same period in ${py} (${pl.length} surgeries, ${pr}%), the SSI rate is ${d>0?`<b class="up">up ${d} points</b>`:d<0?`<b class="dn">down ${-d} points</b>`:'unchanged'}.`)}}
  else{const l0=src.filter(c=>S.dm==='Semua'||(c.tarikhOp||'').slice(5,7)===S.dm),ys=[...new Set(l0.map(c=>(c.tarikhOp||'').slice(0,4)).filter(Boolean))].sort();
    if(ys.length>1){const yr=ys.map(y=>{const l=l0.filter(c=>(c.tarikhOp||'').startsWith(y));return{y,n:l.length,r:rate(l)}});
      const hi=yr.reduce((a,b)=>b.r>a.r?b:a),last=yr[yr.length-1],prev=yr[yr.length-2],d=Math.round((last.r-prev.r)*10)/10;
      F.push(`Yearly SSI rate: ${yr.map(x=>`${x.y} ${x.r}%`).join(' → ')}. Highest in <b>${hi.y}</b>. ${last.y} vs ${prev.y}: ${d>0?`<b class="up">up ${d} points</b>`:d<0?`<b class="dn">down ${-d} points</b>`:'unchanged'}${last.y===TODAYISO.slice(0,4)?' (current year, still in progress)':''}.`)}}
  // Department
  if(ctx.depts.length>1){const dj=ctx.depts.map(j=>{const l=list.filter(c=>c.jabatan===j);return{j,n:l.length,s:l.filter(c=>c.ssi==='Ya').length,r:rate(l)}}).filter(x=>x.n);
    const top=dj.filter(x=>x.s).sort((a,b)=>b.r-a.r);if(top.length)F.push(`Highest SSI rate by department: <b>${esc(top[0].j)}</b> ${top[0].r}% (${top[0].s}/${top[0].n})${top[1]?`, then ${esc(top[1].j)} ${top[1].r}%`:''}.`)}
  // Surgery type
  const tp={};list.forEach(c=>{const k=c.jabatan+' · '+(c.kategori||'—');(tp[k]=tp[k]||[]).push(c)});
  const tt=Object.entries(tp).map(([k,l])=>({k,n:l.length,s:l.filter(c=>c.ssi==='Ya').length})).filter(x=>x.s).map(x=>({...x,r:pct(x.s,x.n)}));
  if(tt.length){const most=tt.slice().sort((a,b)=>b.s-a.s)[0],hr=tt.filter(x=>x.n>=5).sort((a,b)=>b.r-a.r)[0];
    F.push(`Most SSI cases: <b>${esc(most.k)}</b> (${most.s} of ${most.n}, ${most.r}%).${hr&&hr.k!==most.k?` Highest rate among surgeries with ≥5 cases: <b>${esc(hr.k)}</b> ${hr.r}% (${hr.s}/${hr.n}).`:''}`)}
  // Risk factors
  const rk=RISK.map(R=>{const rec=list.filter(R[1]),w=rec.filter(R[2]),wo=rec.filter(c=>!R[2](c));const sw=w.filter(c=>c.ssi==='Ya').length;return{name:R[0],w:w.length,N:rec.length,sw,rw:rate(w),rwo:rate(wo),p:pct(w.length,rec.length)}});
  const strong=rk.filter(x=>x.w>=3&&x.sw>0&&x.rw>x.rwo).sort((a,b)=>(b.rw-b.rwo)-(a.rw-a.rwo)).slice(0,3);
  if(!ctx.rf&&strong.length)F.push(`Risk factors linked with higher SSI: ${strong.map(x=>`<b>${esc(x.name)}</b> ${x.rw}% vs ${x.rwo}% without (${x.sw} SSI in ${x.w} surgeries)`).join('; ')}.`);
  const MOD={'No pre-op bathing':'Reinforce pre-op bathing / chlorhexidine wash before surgery.','Hair removal by shaving':'Replace shaving with clipping (or no hair removal).','Skin prep not chlorhexidine':'Use chlorhexidine-alcohol for skin preparation.','Prophylaxis not given':'Check prophylactic antibiotic is given where indicated.','Prophylaxis > 60 min before incision':'Time prophylaxis within 60 minutes before incision.','Post-op antibiotic ≥ 24 h':'Stop post-op prophylaxis within 24 hours.','Uncontrolled sugar (>11.1)':'Optimise peri-operative glucose control.'};
  rk.filter(x=>MOD[x.name]&&x.N>=5&&x.p>=20).sort((a,b)=>b.p-a.p).forEach(x=>A.push(`<b>${esc(x.name)}</b> in ${x.p}% of surgeries (${x.w}/${x.N}). ${MOD[x.name]}`));
  // Day of SSI & type
  if(s){const dd=ssiL.map(ssiDay).filter(x=>x!=null).sort((a,b)=>a-b);
    if(dd.length){const med=dd[Math.floor((dd.length-1)/2)],early=dd.filter(x=>x<=7).length,late=dd.filter(x=>x>14).length;
      F.push(`SSI identified at a median of <b>day ${med}</b> post-op (range ${dd[0]}–${dd[dd.length-1]}). ${early} of ${dd.length} within the first week; ${late} after day 14${late?' — post-discharge follow-up is picking these up, keep it going':''}.`)}
    const nr=s-dd.length;if(nr)A.push(`${nr} SSI case${nr>1?'s have':' has'} no date SSI identified. Ask the liaison to complete it.`);
    const ty=['Superficial incisional','Deep incisional','Organ/space'].map(t=>[t,ssiL.filter(c=>c.tapak===t).length]).filter(t=>t[1]).sort((a,b)=>b[1]-a[1]),unc=s-ty.reduce((a,t)=>a+t[1],0);
    if(ty.length)F.push(`Type of SSI: ${ty.map(t=>`${t[0]} ${t[1]}`).join(', ')}${unc?`, not classified ${unc}`:''}.`);
    if(unc)A.push(`${unc} SSI case${unc>1?'s are':' is'} not classified (superficial / deep / organ-space). Complete the Type of SSI section.`)}
  else F.push('No SSI cases in this selection.');
  // Data quality
  const full=pct(list.filter(c=>complete(c).pct===100).length,n);if(full<80)A.push(`Only ${full}% of records are complete. Incomplete risk-factor fields make the analysis less reliable.`);
  if(ctx.pend)A.push(`${ctx.pend} patient${ctx.pend>1?'s have':' has'} finished surveillance and still need SSI / no SSI confirmation.`);
  const cav=n<30||s<5?`<p class="hint" style="margin:0">Small numbers (${n} surgeries, ${s} SSI): one case changes the rate a lot, so read trends with caution.</p>`:'';
  return head+`<div id="aiText" class="aitxt"><span class="flabel">Key findings</span><ul>${F.map(x=>`<li>${x}</li>`).join('')}</ul>
   ${A.length?`<span class="flabel">Suggested actions</span><ul>${A.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}</div>${cav}</div>`;
}

const NAME_STOP=/^(NAME|NAMA|PATIENT|DIAGNOSIS|OPERATION|PROCEDURE|WARD|WAD|SURGEON|ANAES|ANAESTHESIA|GA|SA|LA|OT|DR|HOSPITAL|KAJANG|LIST|SENARAI|DATE|TARIKH|AGE|UMUR|SEX|RN|MRN|IC|NO|REMARKS|CATATAN|ELECTIVE|EMERGENCY|THEATRE|DEWAN|BEDAH|TIME|MASA)$/;
// HTPN OT list style: each patient cell starts with "NAME :", then MRN and IC NO lines
function nameAfterLabel(seg){
  const out=[];const lines=seg.split('\n');
  for(let i=0;i<lines.length&&i<6;i++){
    const ln=lines[i].replace(/^[\s\d.,|:;\-–_"“”']+/,'');
    if(/^(M+RN|RN\b|HTPN|I\s*C\s*N|I\s*C\b|IC\s*NO|1CNO|YENO|AGE\b)/i.test(ln))break;
    const toks=ln.split(/\s+/),w=[];
    for(const t of toks){const m=t.match(/^([A-Z][A-Z@'’\/.\-]*)([,:;]?)$/);if(!m)break;const x=m[1].replace(/[.\-]+$/,'');if(x.length>1&&!NAME_STOP.test(x)&&!/^(DSA|DR|MR|MRS|MS|NKDA|NKMI|IV|GA|LA)$/.test(x))w.push(x);if(m[2])break}
    if(w.length)out.push(w.join(' '));
  }
  return out.join(' ').replace(/\s+/g,' ').trim();
}
function parseOTLabels(T,jab){
  const up=T.toUpperCase(),labs=[...up.matchAll(/\bNAME(?!\s*\/)\s*[:\-]?/g)];
  if(!labs.length)return null;
  const icRe=/\b(\d{2})(\d{2})(\d{2})[-\s]?(\d{2})[-\s]?(\d{4})\b/,mrnRe=/(?:HTPN\s*K?\s*|\bM*RN\s*[:.]?\s*)(\d{5,8})\b/;
  const dm=up.match(/\b(\d{1,2})[\/.\-](\d{1,2})[\/.\-](20\d{2}|\d{2})\b/);const gDate=dm?toISO(dm[0]):'';
  const rows=[],skipped=[];
  labs.forEach((m,k)=>{
    const st=m.index+m[0].length,en=k<labs.length-1?labs[k+1].index:up.length,seg=T.slice(st,en),su=up.slice(st,en);
    if(!mrnRe.test(su)&&!icRe.test(su))return;
    const c={nama:nameAfterLabel(seg)};
    const mm=su.match(mrnRe);if(mm)c.mrn='HTPNK'+mm[1];
    const im=su.match(icRe);if(im&&+im[2]>=1&&+im[2]<=12&&+im[3]>=1&&+im[3]<=31){c.ic=im[1]+im[2]+im[3]+'-'+im[4]+'-'+im[5];c._y=+im[1];c._m=+im[2];c._d=+im[3];c._l=+im[5]}
    let kat=normProc(jab,'',su);if(!(PROC[jab]||[]).includes(kat)){kat='';for(const ln of su.split('\n')){const k2=normProc(jab,'',ln);if((PROC[jab]||[]).includes(k2)){kat=k2;break}}}
    const op=(seg.match(/(open reduction[^\n]*|[^\n]*(LSCS|hysterect|TAH|arthroplasty|hernio|cholecyst|thyroid|mastect|colect|AVF|fistula|extraction|removal)[^\n]*)/i)||[])[0]||'';
    c.kategori=kat;c.prosedur=(op.trim()||kat).slice(0,120);c.tarikhOp=gDate||TODAYISO;
    if(!c.nama&&!c.mrn&&!c.ic)return;
    if(kat)rows.push(c);else skipped.push(c.nama||c.mrn||c.ic);
  });
  rows.forEach(c=>{if(c.ic){const cy=+TODAYISO.slice(2,4),yr=(c._y>cy?1900:2000)+c._y;c.dob=yr+'-'+String(c._m).padStart(2,'0')+'-'+String(c._d).padStart(2,'0');c.jantina=c._l%2?'Lelaki':'Perempuan';let ag=+c.tarikhOp.slice(0,4)-yr;if(c.tarikhOp.slice(5)<c.dob.slice(5))ag--;if(ag>=0&&ag<120)c.umur=String(ag)}['_y','_m','_d','_l'].forEach(k=>delete c[k])});

function parseOT(text,jab){
  {const L=parseOTLabels(String(text||'').replace(/\r/g,''),jab);if(L)return L}
  const T=String(text||'').replace(/\r/g,''),up=T.toUpperCase();
  const icRe=/\b(\d{2})(\d{2})(\d{2})[-\s]?(\d{2})[-\s]?(\d{4})\b/g, mrnRe=/\b(?:HTPN\s*K?\s*|MRN[:\s]*|RN[:\s]*)(\d{5,8})\b/g;
  let A=[...up.matchAll(icRe)].map(m=>({i:m.index,e:m.index+m[0].length,ic:m[1]+m[2]+m[3]+'-'+m[4]+'-'+m[5],y:+m[1],mo:+m[2],d:+m[3],last:+m[5]})).filter(a=>a.mo>=1&&a.mo<=12&&a.d>=1&&a.d<=31);
  if(!A.length)A=[...up.matchAll(mrnRe)].map(m=>({i:m.index,e:m.index+m[0].length}));
  const dm=up.match(/\b(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})\b/);const gDate=dm?toISO(dm[0]):'';

    const ls=i=>up.lastIndexOf('\n',i-1)+1,le=i=>{const x=up.indexOf('\n',i);return x<0?up.length:x};
    const prevE=k?A[k-1].e:0,nxt=k<A.length-1?A[k+1]:null;
    const s0=Math.max(prevE,ls(a.i)),e0=nxt?(ls(nxt.i)>a.e?ls(nxt.i):nxt.i):up.length;
    let before=up.slice(s0,a.i);const after=up.slice(a.e,e0);

    const cands=[...before.matchAll(/([A-Z][A-Z'@.\/]+(?:[ \t]+[A-Z][A-Z'@.\/]+){1,7})/g)].map(m=>m[1].split(/\s+/).filter(w=>!NAME_STOP.test(w)).join(' ')).filter(x=>x.split(' ').length>=2&&!/LSCS|LAPARO|HERNI|THYROID|MASTECT|CHOLE|ARTHRO|OMF|ORIF|EXCISION|BIOPSY/.test(x));
    const pref=cands.filter(x=>/\b(BIN|BINTI|BT|BTE|A\/L|A\/P|@)\b/.test(x));
    let nama=(pref.length?pref[pref.length-1]:cands[cands.length-1])||'';
    if(!nama&&wide!==before){const cw=[...wide.matchAll(/([A-Z][A-Z'@.\/]+(?:[ \t]+[A-Z][A-Z'@.\/]+){1,7})/g)].map(m=>m[1]).filter(x=>x.split(' ').length>=2&&!NAME_STOP.test(x.split(' ')[0]));const pw=cw.filter(x=>/\b(BIN|BINTI|BT|BTE|A\/L|A\/P|@)\b/.test(x));nama=(pw.length?pw[pw.length-1]:cw[cw.length-1])||''}
    if(!nama){const c2=[...after.matchAll(/([A-Z][A-Z'@.\/]+(?:[ \t]+[A-Z][A-Z'@.\/]+){1,7})/g)].map(m=>m[1]).filter(x=>/\b(BIN|BINTI|A\/L|A\/P)\b/.test(x));nama=c2[0]||''}
    // surgery: first line in the window that maps to this department's monitored list
    const lines=(after+'\n'+before).split(/\n+/).map(x=>x.trim()).filter(Boolean);let kat='',pros='';
    for(const ln of lines){const k2=normProc(jab,'',ln);if((PROC[jab]||[]).includes(k2)){kat=k2;pros=ln.slice(0,120);break}}
    const anyProc=lines.some(ln=>{const k3=normProc(jab,'',ln);return k3&&k3!==ln.trim()&&k3!==ln})||/S\s*&\s*C|SUCTION|CURETTAGE|EM\s*-?LSCS|EMLSCS|BIOPSY|EXCISION/.test(win);
    if(!kat&&!anyProc){const k2=normProc(jab,'',win);if((PROC[jab]||[]).includes(k2))kat=k2}
    const mm=[...after.matchAll(mrnRe)][0]||[...before.matchAll(mrnRe)][0],dd=win.match(/\b(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})\b/);
    const c={nama:nama.trim(),ic:a.ic||'',mrn:mm?'HTPNK'+mm[1]:'',tarikhOp:(dd&&toISO(dd[0]))||gDate||TODAYISO,kategori:kat,prosedur:pros||kat};
    if(a.ic){const cy=+TODAYISO.slice(2,4),yr=(a.y>cy?1900:2000)+a.y;c.dob=yr+'-'+String(a.mo).padStart(2,'0')+'-'+String(a.d).padStart(2,'0');c.jantina=a.last%2?'Lelaki':'Perempuan';
      if(c.dob){let ag=+c.tarikhOp.slice(0,4)-yr;if(c.tarikhOp.slice(5)<c.dob.slice(5))ag--;if(ag>=0&&ag<120)c.umur=String(ag)}}
    if(!c.nama&&!c.ic)return;
    if(kat)out.push(c);else skipped.push(c.nama||c.ic);
  });
  return {rows:out,skipped};
}

function otApply(text){

function ocrErr(m,isPdf){
  if(/OCR_SETUP/.test(m))return 'Photo/PDF reading is not switched on in the server yet (Drive API service). Coordinator: open Apps Script → Services (+) → Drive API → v3 → Add, then Deploy → New version.';
  if(/OCR_AUTH/.test(m))return 'The server has no permission to read photos yet. Coordinator: in Apps Script select the function testOCR → Run → Allow, then Deploy → New version.';
  if(/Unknown action/.test(m))return 'The server code is an old version. Coordinator: paste the latest Code.gs, then Deploy → Manage deployments → Edit → New version.';
  if(/No connection/.test(m))return m;
  return 'Could not read the file: '+m+'. '+(isPdf?'Try again, or paste the text.':'Retake the photo following the tips, or upload the PDF of the OT list for a more accurate result.');
}
function otRead(file){
  if(!file)return;
  const isPdf=/pdf/i.test(file.type)||/\.pdf$/i.test(file.name);
  S.ot=Object.assign(S.ot||{},{busy:true,err:'',rows:null,tips:false,src:isPdf?'pdf':'photo'});keepY();
  const send=(b64,mime)=>{if(typeof api!=='function'){S.ot.busy=false;S.ot.err='Photo/PDF reading works on the live app. In this preview, paste the text instead.';S.ot.showPaste=true;keepY();return}
    api('ocrFile',{data:b64,mime,name:file.name}).then(r=>{const t=String(r.text||'').trim();if(!t){S.ot.busy=false;S.ot.err=isPdf?'No text was found in this PDF. If it is a scanned PDF, try a clearer copy or paste the text.':'No text could be read from this photo. Retake it closer, straight and in bright light, or upload the PDF of the OT list.';S.ot.showPaste=true;keepY();return}otApply(t)}).catch(e=>{S.ot.busy=false;S.ot.err=ocrErr(e.message,isPdf);S.ot.showPaste=true;keepY()})};
  if(isPdf){if(file.size>10e6){S.ot.busy=false;S.ot.err='PDF is larger than 10 MB.';keepY();return}const fr=new FileReader();fr.onload=()=>send(String(fr.result).split(',')[1],'application/pdf');fr.readAsDataURL(file);return}
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const k=Math.min(1,2200/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(u);send(cv.toDataURL('image/jpeg',.88).split(',')[1],'image/jpeg')};

async function otAdd(){
  const O=S.ot,jab=(S.draft&&S.draft.jabatan)||S.user.jabatan;if(!O||!O.rows)return;
  const list=O.rows.filter(r=>r.on&&r.nama&&r.tarikhOp).map(r=>{const c={id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),jabatan:jab,ssi:'Tiada',susulan:[]};
    ['nama','ic','mrn','dob','umur','jantina','tarikhOp','kategori','prosedur'].forEach(k=>{if(r[k])c[k]=k==='nama'?r[k].toUpperCase():r[k]});return c});
  if(!list.length){toast('Tick at least one patient with a name');return}
  const btn=$('[data-act="otadd"]');if(btn){btn.disabled=true;btn.textContent='Saving…'}
  try{if(typeof api==='function'){await api('importCases',{cases:list});await reloadData(true)}else list.forEach(c=>S.cases.push(c));
    S.ot=null;S.mode='manual';S.tab=S.user.role==='liaison'?'pesakit':'kes';S.pf='kosong';S.py='Semua';S.pm='Semua';render();scrollTo(0,0);toast(`${list.length} patients added · complete their details`)}
  catch(e){toast('Not saved: '+e.message);if(btn){btn.disabled=false;btn.textContent='Add patients'}}

// Which department does an imported file look like?
function guessDept(I){
  if(!I||!I.wb)return null;const cnt={};
  JAB.forEach(j=>{try{cnt[j]=parseWorkbook(I.wb,j,{autoClose:false,skipOther:true}).cases.length}catch(e){cnt[j]=0}});
  const best=JAB.reduce((a,b)=>cnt[b]>cnt[a]?b:a);
  return best!==I.jab&&cnt[best]>=3&&cnt[best]>cnt[I.jab]*1.5?{best,n:cnt[best],mine:cnt[I.jab]}:null;
}

function readMail(){if(!S.mail)return;S.mail.to=$('#m_to').value;S.mail.cc=$('#m_cc').value;S.mail.subj=$('#m_subj').value;S.mail.msg=$('#m_msg').value}

document.addEventListener('change',e=>{
  const T=e.target,id=T.id;
  if(['lyS','lmS','lkS','lsS'].includes(id)){S[{lyS:'ly',lmS:'lm',lkS:'lk',lsS:'ls'}[id]]=T.value;S.lim=50;keepY();return}

function liveCalc(){
  if(S.cur&&S.sd){updateHeads(ALLSEC,S.sd,'csec');const d=document.querySelector('[data-calc="_durasi"]');if(d){const v=durasi(S.sd);d.textContent=v!=null?hhmm(v):'—'}return}
  if(!S.draft||!$('#meter'))return;const c=S.draft,cp=complete(c);updateHeads(SECTIONS,c,'sech');
  const m=$('#meter');m.style.width=cp.pct+'%';m.classList.toggle('done',cp.pct===100);
  $('#meterTxt').textContent=cp.pct+'% complete'+(cp.missing?' · '+cp.missing+' required left':'');
  const d=document.querySelector('[data-calc="_durasi"]');if(d){const v=durasi(c);d.textContent=v!=null?hhmm(v):'—'}
}
function saveEntry(){
  const c=S.draft;
  if(!c.nama||!c.mrn||!c.tarikhOp){toast('Enter name, MRN and date of surgery first');return}
  const dup=S.cases.find(x=>x.id!==c.id&&x.mrn===c.mrn&&x.tarikhOp===c.tarikhOp);
  if(dup){toast('This MRN already has a surgery on the same date');return}
  if(c.id){S.cases[S.cases.findIndex(x=>x.id===c.id)]={...c}}else{c.id='c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);S.cases.push({...c})}persist(S.cases.find(x=>x.id===c.id));
  const cp=complete(c),id=c.id;S.draft=null;
  toast(cp.pct===100?'Saved':'Saved as draft · '+cp.missing+' required fields missing');
  if(S.user.role==='liaison'){S.tab='pesakit';S.pf='Semua';S.py='Semua';S.pm='Semua'}
  openCase(id);
}
function saveSSI(){
  const c=S.cases.find(x=>x.id===S.cur),d=S.sd;
  if(d.ssi==='Ya'){
    if(d.tarikhSSI){const day=dayDiff(d.tarikhOp,d.tarikhSSI);if(day<0||day>survDays(d)){toast(`SSI date must be within ${survDays(d)} days after surgery`);return}}
    const keep=c.susulan;Object.assign(c,JSON.parse(JSON.stringify(d)),{susulan:keep,tutup:false});
    const miss=reqAll(c).filter(k=>c[k]===undefined||c[k]==='').length;
    persist(c);keepY();toast(miss?`SSI form saved · ${miss} fields missing`:'SSI form complete & saved');
  }else{Object.assign(c,{ssi:'Tiada',tarikhSSI:'',tapak:'',diagJenis:'',diagKlinikal:'',organisma:'',readmit:'',tarikhReadmit:''});S.sd=JSON.parse(JSON.stringify(c));persist(c);keepY();toast('Saved')}
}
